- name: Download go tar file
  command: wget https://go.dev/dl/go1.24.1.linux-amd64.tar.gz
 
- name: Delete previous installation
  command: rm -rf /usr/local/go
  become: true

- name: Extract and move new go folder to /usr/local
  command: tar -C /usr/local -xzf go1.24.1.linux-amd64.tar.gz
  become: true

- name: Change ownership of /usr/local/go
  file:
    owner: "{{ ansible_user_id }}"
  become: true

- name: Delete downloaded tar file
  shell: rm -rf go1.24.1.linux-amd64.tar.gz*

- name: Add go binary path to ~/.profile
  lineinfile:
    path: ~/.profile
    line: 'export PATH=$PATH:/usr/local/go/bin:$GOPATH/bin'
    create: true
    state: present

- name: Source updated profile
  shell: . ~/.profile