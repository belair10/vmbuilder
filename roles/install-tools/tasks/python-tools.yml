---
- name: "Install pipx tools"
  community.general.pipx:
    name: "{{ item.name }}"
    source: "{{ item.url }}"
    state: latest
  loop:
    - { name: 'impacket', url: 'git+https://github.com/fortra/impacket.git' }
    - { name: 'netexec', url: 'git+https://github.com/Pennyw0rth/NetExec.git' }
    - { name: 'certipy-ad', url: 'git+https://github.com/ly4k/Certipy.git' }
    - { name: 'bloodhound-ce', url: 'git+https://github.com/dirkjanm/BloodHound.py.git@bloodhound-ce' }
    - { name: 'bloodyAD', url: 'git+https://github.com/CravateRouge/bloodyAD.git' }

# krbrelayx (cloned to /opt/krbrelayx in github-repos.yml) has no pip package and
# depends on impacket/ldap3/dnspython. Inject its deps into the impacket pipx venv
# so the scripts can run against that interpreter.
- name: "Inject krbrelayx's runtime dependencies into the impacket pipx venv"
  community.general.pipx:
    state: inject
    name: impacket
    inject_packages:
      - ldap3
      - dnspython

# The impacket pipx venv lives in the installing user's home; resolve it so the
# wrappers below point at an absolute interpreter path that works for any caller.
- name: "Resolve the pipx venvs directory"
  ansible.builtin.command: pipx environment --value PIPX_LOCAL_VENVS
  register: pipx_venvs
  changed_when: false

- name: "Create PATH wrappers for the krbrelayx tools"
  ansible.builtin.copy:
    dest: "/usr/local/bin/{{ item }}"
    mode: '0755'
    content: |
      #!/bin/sh
      exec "{{ pipx_venvs.stdout }}/impacket/bin/python" "/opt/krbrelayx/{{ item }}.py" "$@"
  loop:
    - krbrelayx
    - addspn
    - dnstool
    - printerbug
  become: true
  become_method: sudo
