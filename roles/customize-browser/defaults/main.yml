---
# Firefox distribution/policies directory differs by distro:
#   Debian/Parrot ships firefox-esr -> /usr/share/firefox-esr/distribution
#   Fedora ships firefox            -> /usr/lib64/firefox/distribution
firefox_policies_path: "{{ '/usr/lib64/firefox/distribution/policies.json' if ansible_facts['os_family'] == 'RedHat' else '/usr/share/firefox-esr/distribution/policies.json' }}"
