- name: "Load distro-specific trust-store paths"
  include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: "Check if BurpSuiteCA.der exists"
  stat:
    path: "{{ burp_ca_cert }}"
  register: burp_cert

- name: "Copying Burp Script"
  copy:
    src: files/getburpcert.sh
    dest: /tmp/getburpcert.sh
    mode: 0744
  when: burp_cert.stat.exists == False

- name: "Executing bash script to Download CA Certificate"
  shell:
    /tmp/getburpcert.sh
  when: burp_cert.stat.exists == False

- name: "Ensure system trust anchor directory exists"
  ansible.builtin.file:
    path: "{{ ca_anchor_dir }}"
    state: directory
    mode: '0755'
  become: true
  become_method: sudo
  when: burp_cert.stat.exists == False

- name: "Copying CA Certificate to the system trust store"
  copy:
    src: /tmp/cacert.der
    dest: "{{ burp_ca_cert }}"
    owner: root
    group: root
    mode: 0644
  become: true
  become_method: sudo
  when: burp_cert.stat.exists == False

- name: "Update the system CA trust store"
  ansible.builtin.command: "{{ ca_update_cmd }}"
  become: true
  become_method: sudo
  when: burp_cert.stat.exists == False

- name: Create directory for Burp Suite extras
  ansible.builtin.file:
    path: "{{ burpsuite_extras_dir }}"
    state: directory
    mode: '0755'
  become: true
  become_method: sudo

- name: Download jar files
  ansible.builtin.get_url:
    url: "{{ item.value.url }}"
    dest: "{{ burpsuite_extras_dir }}/{{ item.value.jar }}"
    checksum: "{{ item.value.checksum }}"
    mode: '0644'
  become: true
  become_method: sudo
  loop: "{{ lookup('dict', burpsuite_extras_jars) }}"
  
- name: Copy BurpSuite Community Config
  template:
    src: "templates/UserConfigCommunity.json.j2"
    dest: "/home/{{ ansible_facts['user_id'] }}/.BurpSuite/UserConfigCommunity.json"

