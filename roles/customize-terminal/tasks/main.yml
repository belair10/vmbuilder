---
- name: "Copy BashRC"
  copy:
    src: "{{ role_path }}/files/.bashrc2"
    dest: "{{ ansible_facts['env'].HOME }}/.bashrc"

- name: "Ensure .bash_profile sources .bashrc inside tmux"
  lineinfile:
    path: "{{ ansible_facts['env'].HOME }}/.bash_profile"
    line: |
      if [[ -n "$TMUX" ]]; then
          source ~/.bashrc
      fi
    insertafter: EOF
    create: yes

