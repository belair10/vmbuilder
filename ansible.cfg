[defaults]
# Hide "skipping: [host]" lines so the multi-distro `when:` branches
# (the tasks that don't apply to the current distro) don't clutter output.
display_skipped_hosts = False

[privilege_escalation]
# Prompt once for the sudo (become) password at the start of the run and reuse
# it for every privileged task. This avoids relying on sudo's tty-scoped
# credential cache, which Ansible does not share (priming `sudo whoami` first
# does not work on Fedora). Equivalent to always passing --ask-become-pass/-K.
become_ask_pass = True
